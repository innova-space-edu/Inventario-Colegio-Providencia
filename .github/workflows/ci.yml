name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Check Access validator syntax
        run: node --check scripts/validate-access-export.mjs
      - name: Smoke test Access validator
        run: |
          mkdir -p /tmp/access-preflight
          cat > /tmp/access-preflight/COMPUTADORAS.json <<'JSON'
          [{"ID":1,"CODIGO":"CP-001","SERIE":"SERIE-001","FAMILIA":"NOTEBOOK"}]
          JSON
          cat > /tmp/access-preflight/manifest.json <<'JSON'
          {"source_file":"fixture.accdb","source_sha256":"fixture","tables":[{"name":"COMPUTADORAS","file":"COMPUTADORAS.json","row_count":1,"error":null}]}
          JSON
          node scripts/validate-access-export.mjs /tmp/access-preflight --json > /tmp/access-preflight-report.json
          node -e 'const r=require("/tmp/access-preflight-report.json"); if(r.errors.length || r.totals.parsed_rows !== 1) process.exit(1)'
      - name: Check Access importer syntax
        run: node --check scripts/import-access.mjs
      - name: Check Access exporter syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/export-access.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
