name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Access migration scripts syntax
        run: |
          node --check scripts/legacy-identity.mjs
          node --check scripts/validate-access-export.mjs
          node --check scripts/import-access.mjs
      - name: Smoke test stable Access identities
        run: |
          node --input-type=module - <<'NODE'
          import { createSourceIdentityResolver } from './scripts/legacy-identity.mjs';
          const rows = [
            { CODIGO: 'A-1', MARCA: 'Uno' },
            { CODIGO: 'B-2', MARCA: 'Dos' },
            { CODIGO: 'A-1', MARCA: 'Uno' },
          ];
          const firstResolver = createSourceIdentityResolver();
          const secondResolver = createSourceIdentityResolver();
          const first = rows.map((row) => firstResolver(row).sourceId).sort();
          const second = [...rows].reverse().map((row) => secondResolver(row).sourceId).sort();
          if (JSON.stringify(first) !== JSON.stringify(second)) process.exit(1);
          if (!first.every((id) => id.startsWith('hash-'))) process.exit(1);
          NODE
      - name: Smoke test Access validator
        run: |
          mkdir -p /tmp/access-preflight
          cat > /tmp/access-preflight/COMPUTADORAS.json <<'JSON'
          [{"CODIGO":"CP-001","SERIE":"SERIE-001","FAMILIA":"NOTEBOOK"}]
          JSON
          cat > /tmp/access-preflight/manifest.json <<'JSON'
          {"source_file":"fixture.accdb","source_sha256":"fixture","tables":[{"name":"COMPUTADORAS","file":"COMPUTADORAS.json","row_count":1,"error":null}]}
          JSON
          node scripts/validate-access-export.mjs /tmp/access-preflight --json > /tmp/access-preflight-report.json
          node -e 'const r=require("/tmp/access-preflight-report.json"); if(r.errors.length || r.totals.parsed_rows !== 1 || r.totals.generated_source_ids !== 1) process.exit(1)'
      - name: Check Access PowerShell syntax
        shell: pwsh
        run: |
          $files = @("scripts/export-access.ps1", "scripts/migrate-access.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
